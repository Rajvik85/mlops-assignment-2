stages:
  prepare:
    cmd: >-
      python -m catsdogs.preprocessing
      --input data/raw
      --output data/processed
      --image-size ${prepare.image_size}
      --train-ratio ${prepare.train_ratio}
      --val-ratio ${prepare.val_ratio}
      --seed ${prepare.seed}
    deps:
      - data/raw
      - src/catsdogs/preprocessing.py
    params:
      - prepare
    outs:
      - data/processed
  train:
    cmd: >-
      python -m catsdogs.train_cnn
      --data data/processed
      --model-output models/cats_dogs_cnn.onnx
      --checkpoint-output models/cats_dogs_cnn.pt
      --reports-dir reports
      --epochs ${train.epochs}
      --learning-rate ${train.learning_rate}
      --max-learning-rate ${train.max_learning_rate}
      --batch-size ${train.batch_size}
      --weight-decay ${train.weight_decay}
      --dropout ${train.dropout}
      --seed ${train.seed}
      --patience ${train.patience}
      --num-workers ${train.num_workers}
      --augmentation
    deps:
      - data/processed
      - src/catsdogs/cnn.py
      - src/catsdogs/model.py
      - src/catsdogs/train_cnn.py
    params:
      - train
    plots:
      - reports/figures/loss_curve.png:
          cache: false
      - reports/figures/confusion_matrix.png:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
