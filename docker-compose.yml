services:
  cats-dogs-api:
    image: ${IMAGE_NAME:-cats-dogs-mlops:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cats-dogs-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: INFO
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - monitoring-data:/app/reports/monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  monitoring-data:

