name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cats-dogs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: pytest

      - name: Build container image
        run: docker build --tag cats-dogs-mlops:ci .

      - name: Run container smoke test
        run: |
          docker run --detach --name cats-dogs-ci --publish 8000:8000 cats-dogs-mlops:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs cats-dogs-ci; exit 1; fi
            sleep 2
          done
          python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Show service logs on failure
        if: failure()
        run: docker logs cats-dogs-ci || true

      - name: Remove CI container
        if: always()
        run: docker rm --force cats-dogs-ci || true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.name }}
      latest: ${{ steps.image.outputs.latest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Calculate lowercase GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "latest=$(echo ghcr.io/${GITHUB_REPOSITORY}:latest | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Build and publish immutable and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.latest }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, mlops-deploy]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out deployment manifest and smoke test
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy new image
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
        run: |
          docker compose pull cats-dogs-api
          docker compose up --detach --no-build --remove-orphans cats-dogs-api

      - name: Wait for health and fail on timeout
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs cats-dogs-api
          exit 1

      - name: Post-deployment health and prediction smoke test
        shell: bash
        run: |
          sample_file="${RUNNER_TEMP}/smoke.png"
          response_file="${RUNNER_TEMP}/prediction.json"
          python3 -c 'import base64,sys; open(sys.argv[1], "wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAFElEQVR4nGO8VGvDgA0wYRUdtBIAOS8Bm84r0rQAAAAASUVORK5CYII="))' "$sample_file"
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent --form "image=@${sample_file};type=image/png" http://127.0.0.1:8000/predict > "$response_file"
          python3 - "$response_file" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1], encoding="utf-8"))
          assert body["label"] in {"cat", "dog"}
          assert set(body["probabilities"]) == {"cat", "dog"}
          assert abs(sum(body["probabilities"].values()) - 1.0) < 1e-5
          print("Post-deployment prediction passed:", body["label"])
          PY
